title: Suspicious LSASS Access with Credential Dumping Access Mask
id: 9a1e3f5b-2c4d-4e6a-8b1f-3d5c7a9e0b2f
status: experimental
description: Detects a process accessing lsass.exe with an access mask consistent with credential dumping tools such as Mimikatz
references:
    - internal Case 2 investigation, Gun 35
author: Gaye Nur Gunes
date: 2026-09-11
modified: 2026-09-18
tags:
    - attack.credential-access
    - attack.t1003.001
logsource:
    category: process_access
    product: windows
detection:
    selection:
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess: '0x1410'
    filter_known_av_edr:
        SourceImage|endswith:
            - '\MsMpEng.exe'
            - '\MsSense.exe'
    condition: selection and not filter_known_av_edr
falsepositives:
    - Some legitimate security/monitoring tools (Defender, EDR agents) may request a similar access mask; filter_known_av_edr excludes the most common ones observed, but SourceImage should still be reviewed manually since this list is not exhaustive
level: critical
